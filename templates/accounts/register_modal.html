{% load static %}
<!-- Modal Register for Jkokoro -->
<div id="registerModal" class="jk-modal" style="display:none;">
  <div class="jk-modal-content">
    <span class="jk-modal-close" onclick="closeRegisterModal()">&times;</span>
    <div class="jk-modal-body">
      <div class="jk-modal-left">
        <h2 style="text-transform:uppercase;">Tạo tài khoản Jkokoro</h2>
        <form id="registerForm" method="post" action="{% url 'accounts:register' %}">
          {% csrf_token %}
          <div class="form-group">
            <label for="full_name">Họ và tên</label>
            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Họ và tên" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
          </div>
          <div class="form-group">
            <label for="password1">Mật khẩu</label>
            <input type="password" class="form-control" id="password1" name="password1" placeholder="Mật khẩu" required>
          </div>
          <div class="form-group">
            <label for="password2">Nhập lại mật khẩu</label>
            <input type="password" class="form-control" id="password2" name="password2" placeholder="Nhập lại mật khẩu" required>
          </div>
          <div class="form-group" style="margin-top:6px; margin-bottom:0; display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="agree" name="agree" required style="vertical-align:middle; margin:0;">
            <label for="agree" style="font-size:0.98em;vertical-align:middle; margin:0;">Tôi đồng ý với mọi <a href="#" style="color:#1a7f37;text-decoration:underline;">điều khoản và chính sách</a></label>
          </div>
</script>

<style>
/* Thu nhỏ input trong modal đăng ký */
.jk-input-small {
  padding: 8px 12px;
  font-size: 1em;
  border-radius: 10px;
  margin-bottom: 0;
}
.jk-modal-left .form-group { margin-bottom: 10px; }
</style>
          <button type="submit" class="jk-btn jk-btn-green" style="margin-top:18px;">Đăng ký</button>
        </form>
        <div class="jk-modal-or">
          <span style="display:inline-block;width:20%;border-top:1px solid #e0e0e0;vertical-align:middle;margin-right:8px;"></span>
          <span style="color:#3a3a3a;font-weight:500;">Hoặc đăng nhập với</span>
          <span style="display:inline-block;width:20%;border-top:1px solid #e0e0e0;vertical-align:middle;margin-left:8px;"></span>
        </div>
        <div class="jk-modal-social" style="display:flex;gap:18px;justify-content:center;margin-top:12px;">
          <a href="/oauth/login/facebook/" class="jk-social-btn" style="display:flex;align-items:center;gap:8px;background:#f6fbfd;border-radius:12px;padding:10px 28px 10px 18px;text-decoration:none;box-shadow:none;border:none;min-width:140px;">
            <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="16" fill="#1877F3"/><path d="M21.333 16.001h-3.2v8h-3.2v-8h-1.6v-2.667h1.6v-1.6c0-2.133 1.067-3.2 3.2-3.2h2.133v2.667h-1.067c-.533 0-.8.267-.8.8v1.333h2.133l-.267 2.667z" fill="#fff"/></svg>
            <span style="color:#1877F3;font-weight:500;font-size:1.1rem;">Facebook</span>
          </a>
          <a href="{% url 'social:begin' 'google-oauth2' %}?next={{ request.path }}" class="jk-social-btn" style="display:flex;align-items:center;gap:8px;background:#f6fbfd;border-radius:12px;padding:10px 28px 10px 18px;text-decoration:none;box-shadow:none;border:none;min-width:140px;">
            <svg width="28" height="28" viewBox="0 0 32 32"><g><circle fill="#fff" cx="16" cy="16" r="16"/><path d="M25.6 16.204c0-.64-.057-1.28-.172-1.904H16v3.6h5.36c-.232 1.232-.936 2.28-1.992 2.984v2.48h3.224c1.888-1.736 2.976-4.296 2.976-7.16z" fill="#4285F4"/><path d="M16 26c2.7 0 4.968-.892 6.624-2.424l-3.224-2.48c-.896.6-2.04.952-3.4.952-2.616 0-4.832-1.768-5.624-4.144h-3.32v2.6C8.992 23.888 12.232 26 16 26z" fill="#34A853"/><path d="M10.376 17.904A5.997 5.997 0 0 1 10 16c0-.656.112-1.296.312-1.904v-2.6h-3.32A9.997 9.997 0 0 0 6 16c0 1.624.392 3.16 1.064 4.504l3.312-2.6z" fill="#FBBC05"/><path d="M16 10.376c1.472 0 2.784.504 3.824 1.488l2.872-2.872C20.968 7.892 18.7 7 16 7c-3.768 0-7.008 2.112-8.688 5.496l3.312 2.6c.792-2.376 3.008-4.144 5.376-4.144z" fill="#EA4335"/></g></svg>
            <span style="color:#444;font-weight:500;font-size:1.1rem;">Google</span>
          </a>
        </div>
        <div class="jk-modal-register" style="text-align:center;">
          Bạn đã có tài khoản? <a href="#" class="jk-link" onclick="switchToLoginModal();return false;">Đăng nhập ngay</a>
        </div>
      </div>
      <div class="jk-modal-right">
        <img src="{% static 'img/login2.jpg' %}" alt="Jkokoro register" class="jk-modal-img">
        <div class="jk-modal-brand">
          <div class="jk-modal-brand-title">JKOKORO</div>
          <div class="jk-modal-brand-desc">Hệ sinh thái Nhật Ngữ số 1 dành cho người Việt</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function openRegisterModal() {
  document.getElementById('registerModal').style.display = 'flex';
}
function closeRegisterModal() {
  document.getElementById('registerModal').style.display = 'none';
}
function switchToLoginModal() {
  closeRegisterModal();
  openLoginModal();
}
</script>
