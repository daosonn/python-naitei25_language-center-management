{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="container">
  <h3>{% trans "Đổi mật khẩu" %}</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">{% trans "Lưu lại" %}</button>
    <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">{% trans "Hủy bỏ" %}</a>
  </form>
</div>
{% endblock %}
